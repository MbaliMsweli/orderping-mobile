<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; font-family: 'DM Sans', sans-serif; }
    header {
      background: linear-gradient(145deg, #1A56E8 0%, #3B82F6 100%);
      padding-bottom: 32px;
    }
    .inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 0;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .bell-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: #FFFFFF;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .bell-icon {
      width: 14px; height: 14px;
      color: #1A56E8;
    }
    .order { color: rgba(255,255,255,0.80); font-weight: 600; }
    .ping  { color: #FFFFFF; font-weight: 800; }
    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.02em;
    }
    .settings-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: #FFFFFF;
      cursor: pointer;
      color: #1A56E8;
      font-family: 'Sora', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .greeting {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 1.375rem;
      color: #FFFFFF;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.70);
      font-weight: 400;
    }
    svg { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <div class="top-row">
        <div class="brand">
          <div class="wordmark">
            <span class="bell-circle">
              <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </span>
            <span class="order">Order</span>
            <span class="ping">Ping</span>
          </div>
          <span class="tagline">One click. Communicate. Connect.</span>
        </div>
        <button class="settings-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </button>
      </div>
      <p class="greeting">Good morning 👋</p>
      <p class="sub">Keep customers informed while they wait.</p>
    </div>
  </header>
</body>
</html>
